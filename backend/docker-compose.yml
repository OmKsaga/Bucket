version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bucket_postgres
    restart: always
    environment:
      POSTGRES_USER: bucket_user
      POSTGRES_PASSWORD: bucket_password
      POSTGRES_DB: bucket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bucket_user -d bucket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bucket_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://bucket_user:bucket_password@db:5432/bucket_db
      SECRET_KEY: dev_secret_key_change_in_production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
