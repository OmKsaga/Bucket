name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install App Dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bucket-app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.5.0
          name: "Bucket App v0.5.0 Release"
          body: |
            ### Bucket Virtual UPI Wallet - Android Release APK
            
            **Direct Download for Android:**
            Download `app-release.apk` below directly to your Android device to install and test the app.
          files: app/build/app/outputs/flutter-apk/app-release.apk
